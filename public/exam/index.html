<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1e22" />
  <meta name="description" content="推免机试 AI-off 陪练台" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
  <title>机试训练</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-index">EXAM / 01</span>
        <strong>机试训练</strong>
      </div>
      <button id="syncButton" class="sync-button" type="button">
        <span id="syncDot" class="sync-dot"></span>
        <span id="syncText">未登录</span>
      </button>
    </header>

    <main>
      <section id="viewToday" class="view active" data-view="today">
        <section id="syncBanner" class="sync-banner">
          <div>
            <strong>手机 ⇄ 电脑同步未开启</strong>
            <span>登录一次即可跨设备接着练。</span>
          </div>
          <button id="syncBannerButton" type="button">登录同步</button>
        </section>

        <section class="task">
          <div class="task-kicker">NEXT</div>
          <h1 id="questTitle">LeetCode 79 · 单词搜索</h1>
          <div class="task-meta">
            <span id="questModule">搜索 / 回溯</span>
            <span id="questEvidence">上次 55 min · 未通过</span>
          </div>

          <div class="focus-line">
            <span>这轮只练</span>
            <b id="questFocus">递归返回后恢复现场</b>
          </div>

          <ol class="howto">
            <li><b>打开题目</b><span>只看题面，不看题解。</span></li>
            <li><b>关 AI 写代码</b><span>从空白开始，编译和本地调试都可以。</span></li>
            <li><b>提交后回这里</b><span>按「AC」或「卡住」，我再接管复盘。</span></li>
          </ol>

          <a id="openProblemButton" class="primary-action" href="#" target="_blank" rel="noreferrer">打开题目</a>

          <div id="idlePanel" class="start-row">
            <div class="duration-select" role="group" aria-label="训练时长">
              <button data-minutes="12" type="button">12m</button>
              <button data-minutes="30" class="selected" type="button">30m</button>
              <button data-minutes="90" type="button">90m</button>
            </div>
            <button id="startButton" class="start-button" type="button">开始训练</button>
          </div>

          <div id="sessionPanel" class="session hidden">
            <div class="session-top">
              <span class="ai-off">[ AI OFF ]</span>
              <span id="timer" class="timer">30:00</span>
            </div>
            <div class="result-row">
              <button id="acButton" class="result-button ac" type="button">AC</button>
              <button id="stuckButton" class="result-button" type="button">卡住</button>
              <button id="stopButton" class="result-button subtle" type="button">结束</button>
            </div>
            <div id="sessionHint" class="session-hint">提交后直接点结果。</div>
          </div>
        </section>

        <section class="quick-links">
          <button id="copyStateButton" type="button">复制当前状态给 GPT</button>
          <button id="switchQuestButton" type="button">查看复活队列</button>
        </section>
      </section>

      <section id="viewRevive" class="view" data-view="revive">
        <div class="section-head">
          <span>REVIEW</span>
          <h2>复活队列</h2>
          <p>提示后通过和失败题，都会回来再打一遍。</p>
        </div>
        <div id="revivalList" class="list"></div>
      </section>

      <section id="viewSkills" class="view" data-view="skills">
        <div class="section-head">
          <span>MAP</span>
          <h2>能力</h2>
          <p>只看证据，不看刷题数量。</p>
        </div>
        <div id="skillList" class="list"></div>
      </section>

      <section id="viewHistory" class="view" data-view="history">
        <div class="section-head">
          <span>LOG</span>
          <h2>记录</h2>
          <p id="historySummary"></p>
        </div>
        <div id="historyList" class="list"></div>

        <details class="data-panel">
          <summary>同步 / 数据</summary>
          <div id="authArea"></div>
          <div class="data-actions">
            <button id="exportButton" type="button">导出 JSON</button>
            <label>导入 JSON<input id="importInput" type="file" accept="application/json" /></label>
          </div>
        </details>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="导航">
      <button class="nav-item active" data-target="today" type="button">训练</button>
      <button class="nav-item" data-target="revive" type="button">复活</button>
      <button class="nav-item" data-target="skills" type="button">能力</button>
      <button class="nav-item" data-target="history" type="button">记录</button>
    </nav>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button id="modalClose" class="modal-close" type="button">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
