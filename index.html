<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LV-ZHU | Personal Space</title>
    <script>
      (function () {
        var saved = localStorage.getItem('lv-zhu-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect hack — map old static URLs to React routes
      (function() {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          // Remove /pages/ prefix and /index.html suffix from old URLs
          decoded = decoded.replace(/^\/pages\//, '/').replace(/\/index\.html$/, '').replace(/\.html$/, '');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
